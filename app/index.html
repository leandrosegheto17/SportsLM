<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      SEC-01 (TASK.md Lote 12) / ADR-011 passo 9: Política de Segurança de
      Conteúdo declarada via <meta http-equiv>, já que o hosting estático
      escolhido não permite cabeçalhos HTTP próprios (limitação aceita no
      ADR-011: `frame-ancestors`/`X-Frame-Options` não funcionam por <meta> e
      ficam de fora — débito registrado RT-13).

      `connect-src`: 'self' cobre a leitura dos snapshots estáticos do
      próprio produto (`/dados/*.json`, SDD §2.2). O host de telemetria fica
      como placeholder comentado — TEL-01/SPK-04 ainda não define o provedor
      real (TASK.md Lote 12/13); quando TEL-01 escolher o provedor, adicionar
      o host real à diretiva `connect-src` abaixo (nunca remover 'self').

      REFAT-12-01 (achado SEC-12-01, fecha o débito aceito em SEC-01):
      `style-src` agora segue a leitura literal do ADR-011 — **sem**
      `'unsafe-inline'`. O débito anterior partia de uma premissa que não se
      confirmou: `style-src` bloqueia a manipulação do **atributo HTML**
      `style` (markup, `Element.setAttribute('style', ...)`,
      `CSSStyleDeclaration.cssText`), mas **não** bloqueia a manipulação do
      CSSOM feita propriedade a propriedade
      (`CSSStyleDeclaration.setProperty()` / `estilo[propriedade] = valor`)
      — comportamento documentado (MDN, content-security-policy.com) e
      confirmado lendo o próprio código-fonte do React usado neste projeto
      (`setValueForStyles` em `react-dom`, `node_modules/react-dom/cjs/
      react-dom.development.js`): toda prop `style={{...}}` do React,
      incluindo custom properties CSS (`--cartao-cor-barra`,
      `--bloco-preto-*`, `--clube-*` etc., usadas por CartaoIngresso,
      BlocoPreto, FaixaClube, AvatarClube, BarraPontuacao, Navegacao,
      TabelaClassificacao, Comparativo, PainelTime, Simulacao,
      SecaoIdentidade — ver `app/design-system/README.md`/`tokens.css`) é
      aplicada via `style.setProperty(nome, valor)` (propriedades `--*`) ou
      `style[nome] = valor` (demais propriedades) — nunca via
      `setAttribute('style', ...)`/`cssText` (confirmado por busca: nenhuma
      ocorrência real no projeto). Por isso remover `'unsafe-inline'` de
      `style-src` **não** exige nonce/hash nem reescrever componente algum:
      o vetor que a diretiva restringe (atributo `style` vindo de
      HTML/markup) nunca foi o mecanismo usado aqui. Não há CSS-in-JS de
      runtime no projeto (`styled-components`/`emotion`/similar — só CSS
      Modules, que viram arquivo `.css` externo servido por
      `<link rel="stylesheet">`, já coberto por `style-src 'self'`), então
      não há `<style>`/`textContent` dinâmico a se preocupar. Prova
      automatizada em `dominio/noticias/sec-01-sanitizacao-csp.test.tsx`
      (suíte "REFAT-12-01").
    -->
    <!-- connect-src 'self' https://<host-de-telemetria-a-definir-por-TEL-01>; -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none';"
    />
    <title>SportsLM</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
