name: Ingestão agendada

# ADR-002: ingestão periódica em CI agendado. Enquanto os coletores
# (ING-N-*/ING-F-*, Lotes 4/5 do TASK.md) não existem, este workflow roda em
# modo dry-run: valida agendamento, cofre de segredo e alvo de publicação sem
# erro de configuração, sem publicar nada.
#
# ADR-018: os snapshots públicos (contrato do SDD §2.2, `dist-dados/`) são
# publicados direto em `app/public/dados/`, em `main` — não mais na branch
# órfã `dados` — porque o hosting da SPA passou a ser o Vercel (integração
# Git com `origin/main`, sem GitHub Pages), que só builda/serve o conteúdo de
# `main`. A branch órfã `dados` deixou de ser destino dos snapshots públicos
# a partir desta versão (ver nota de supersessão no topo do ADR-002).
#
# Segredo esperado (a cadastrar em Settings > Secrets and variables > Actions,
# ação operacional fora deste arquivo): FOOTBALL_DATA_API_TOKEN — token do
# provedor de futebol (football-data.org), nunca em código nem em log
# (SDD §7.2, GUARDRAILS §2/§4).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ingestao-agendada
  cancel-in-progress: false

permissions:
  contents: write # escopo mínimo: comitar app/public/dados/ direto em `main` (ADR-018). Nada além.

jobs:
  ingestao:
    name: Ingestão de notícias e futebol (dry-run até Lotes 4/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configura Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instala dependências (determinístico)
        run: npm ci

      - name: Portões de qualidade (tsc / lint / format / test)
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test

      - name: Auditoria de dependências de runtime (GUARDRAILS §2)
        run: npm audit --omit=dev --audit-level=high

      - name: Executa pipeline de ingestão
        id: ingestao
        env:
          # SDD §7.2 / GUARDRAILS §4: segredo só como variável de ambiente do
          # job, nunca em código, arquivo de configuração ou artefato. O
          # GitHub Actions mascara automaticamente qualquer ocorrência do
          # valor do secret nos logs a partir do momento em que é referenciado
          # aqui — por isso ele nunca é ecoado (`echo`) neste workflow.
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          set -euo pipefail

          if ! npm run | grep -qE '^\s+ingestao$'; then
            echo "Nenhum coletor implementado ainda (ING-N-*/ING-F-*, Lotes 4/5 do TASK.md)."
            echo "Dry-run: schedule, cofre de segredo e alvo de publicação (branch dados) validados sem erro de configuração."
            echo "publica=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${FOOTBALL_DATA_API_TOKEN:-}" ]; then
            # REFAT-06-01: o script existe, mas o Fluxo 2 (futebol) exige o
            # token real (`executarIngestaoFutebolEmDisco` lança erro sem
            # ele) — sem o secret cadastrado, mantém o dry-run informativo em
            # vez de falhar o job a cada execução agendada.
            echo "Aviso: FOOTBALL_DATA_API_TOKEN ainda não cadastrado no cofre de segredo deste repositório."
            echo "Dry-run: pipeline pronto (npm run ingestao existe), aguardando o secret ser cadastrado para publicar de fato (ADR-018: destino é app/public/dados/ em main)."
            echo "publica=false" >> "$GITHUB_OUTPUT"
          else
            npm run ingestao
            echo "publica=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificação de segredo no diretório de dados publicado (bloqueante — SDD §7.2, PUB-03)
        if: steps.ingestao.outputs.publica == 'true'
        run: |
          set -euo pipefail

          if [ ! -d "dist-dados" ]; then
            echo "Diretório dist-dados não encontrado; nada a verificar."
            exit 0
          fi

          # Reaproveita o mesmo módulo genérico de varredura de segredo
          # usado no build da SPA (FUND-03), apontado para o diretório de
          # dados publicado em vez do artefato do Vite — mesma bateria de
          # padrões (`token`, `api_key`, `Bearer`, chave hex 32+), sem
          # duplicar a lógica de detecção.
          npm run verificar-segredos:dados

      - name: Publica snapshots públicos em app/public/dados (main — ADR-018)
        if: steps.ingestao.outputs.publica == 'true'
        run: |
          set -euo pipefail

          if [ ! -d "dist-dados" ]; then
            echo "Diretório dist-dados não encontrado; nada a publicar."
            exit 0
          fi

          git config user.name "sportslm-bot"
          git config user.email "actions@users.noreply.github.com"

          # ADR-018: permanece em `main` (nunca troca de branch) — o Vercel só
          # builda/serve o conteúdo de `main`, e este passo publica os
          # snapshots públicos (contrato do SDD §2.2) direto em
          # `app/public/dados/`, sobrescrevendo o que houver.
          rm -rf app/public/dados
          mkdir -p app/public/dados
          cp -r dist-dados/. app/public/dados/

          git add app/public/dados
          if git diff --cached --quiet; then
            echo "Sem mudança de conteúdo; nenhuma publicação necessária (SDD §2.2 — publica só se o hash mudou)."
          else
            git commit -m "chore(dados): atualiza snapshots de ingestão [skip ci]"

            # `main` pode ter avançado desde o checkout deste job (outro push
            # concorrente, improvável mas possível) — rebase antes do push
            # evita falha por non-fast-forward.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
